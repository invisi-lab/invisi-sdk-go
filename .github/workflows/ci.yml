name: Go SDK modules

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Check six module boundaries and tests
        run: python3 scripts/test-modules.py
      - name: Verify isolated module archives
        run: python3 scripts/check-packages.py
