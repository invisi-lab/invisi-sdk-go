name: Go SDK modules

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  actions: read

concurrency:
  group: go-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  previous:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/ci-reuse.yml
    with:
      ref: ${{ github.sha }}
      branches: ${{ github.ref == 'refs/heads/main' && 'develop' || 'develop,main' }}
  modules:
    needs: previous
    if: "!cancelled() && (needs.previous.result == 'success' || needs.previous.result == 'skipped') && needs.previous.outputs.verified != 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Test CI reuse safety
        run: python3 scripts/test_ci_reuse.py
      - name: Test versioned release notes
        run: python3 scripts/test_release_notes.py
      - name: Check module boundaries and tests
        run: python3 scripts/test-modules.py
      - name: Verify isolated module archives
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: python3 scripts/check-packages.py

  release:
    name: Publish Go release notes
    needs: [previous, modules]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.previous.result == 'success' && (needs.modules.result == 'success' || (needs.modules.result == 'skipped' && needs.previous.outputs.verified == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Verify tagged module archives
        run: python3 scripts/check-packages.py
      - name: Render complete release notes
        run: python3 scripts/release-notes.py "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false \
              --title "Go SDK $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Go SDK $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
